# 전시용 설정: 실제 접속 정보와 자격증명은 포함하지 않습니다.
server:
  address: localhost
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

naver:
  map:
    directions:
      base-url: ${NAVER_DIRECTIONS_BASE_URL:https://example.invalid/map-direction/v1}
      reverse-base-url: ${NAVER_REVERSE_BASE_URL:https://example.invalid/map-reversegeocode/v2}
      client-id: ${NAVER_MAP_DIRECTIONS_CLIENT_ID}
      client-secret: ${NAVER_MAP_DIRECTIONS_CLIENT_SECRET}

app:
  upload:
    menu-dir: ${UPLOAD_MENU_DIR:./uploads/menu}
    review-dir: ${UPLOAD_REVIEW_DIR:./uploads/review}
    place-dir: ${UPLOAD_PLACE_DIR:./uploads/place}
    gcoo_dir: ${UPLOAD_GCOO_DIR:./uploads/gcoo}
  base-url: ${APP_BASE_URL:https://example.invalid}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

mqtt:
  enabled: ${MQTT_ENABLED:false}
  host: ${MQTT_HOST:example.invalid}
  port: ${MQTT_PORT:1883}
